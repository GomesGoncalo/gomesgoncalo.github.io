<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post — Gonçalo Gomes</title>
<meta property="og:type" content="article">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:url" content="">
<link rel="canonical" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');</script>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/tomorrow-night.min.css">
<style>
  /* Narrower container for reading comfort */
  .container { max-width: 720px; }

  /* READING PROGRESS */
  #reading-progress {
    position: fixed; top: 0; left: 0; z-index: 300;
    height: 2px; width: 0%;
    background: var(--green);
    transition: width 0.1s linear;
    pointer-events: none;
  }

  /* POST HEADER */
  .post-header {
    padding: 7rem 0 3rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 3rem;
  }

  .post-title {
    font-family: var(--sans);
    font-size: clamp(1.75rem, 4vw, 2.75rem);
    font-weight: 800;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 1rem;
  }

  .post-meta-bar {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .post-date { font-size: 12px; color: var(--text3); }
  .read-time  { font-size: 12px; color: var(--text3); }
  .post-tags  { display: flex; flex-wrap: wrap; gap: 4px; }

  /* MARKDOWN CONTENT */
  .post-content {
    padding-bottom: 4rem;
  }

  .post-content h1,
  .post-content h2,
  .post-content h3,
  .post-content h4 {
    font-family: var(--sans);
    font-weight: 700;
    color: var(--text);
    margin: 2.5rem 0 1rem;
    line-height: 1.3;
  }
  .post-content h1 { font-size: 1.9rem; }
  .post-content h2 {
    font-size: 1.35rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .post-content h3 { font-size: 1.1rem; color: var(--text2); }
  .post-content h4 { font-size: 0.95rem; color: var(--text3); }

  .post-content p { margin-bottom: 1.4rem; color: var(--text2); line-height: 1.8; }

  .post-content a { color: var(--green); text-underline-offset: 3px; }
  .post-content a:hover { color: var(--green2); }

  .post-content ul,
  .post-content ol {
    margin: 0 0 1.4rem 1.5rem;
    color: var(--text2);
  }
  .post-content li { margin-bottom: 0.3rem; line-height: 1.8; }

  .post-content strong { color: var(--text); font-weight: 500; }
  .post-content em { color: var(--amber); font-style: italic; }

  .post-content blockquote {
    border-left: 2px solid var(--green);
    padding: 0.75rem 1.25rem;
    margin: 1.5rem 0;
    background: var(--green-dim);
    border-radius: 0 4px 4px 0;
    color: var(--text2);
    font-style: italic;
  }
  .post-content blockquote p { margin-bottom: 0; color: var(--text2); }

  .post-content code {
    font-family: var(--mono);
    font-size: 0.88em;
    color: var(--green);
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .post-content pre {
    background: var(--bg2) !important;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.25rem 1.5rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 1.5rem 0;
    position: relative;
  }
  .post-content pre code {
    font-size: 13px;
    color: var(--text);
    background: none;
    border: none;
    padding: 0;
    border-radius: 0;
  }
  .post-content pre .lang-label {
    position: absolute;
    top: 0.5rem; right: 0.75rem;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  pre:hover .lang-label { opacity: 0; }

  /* COPY BUTTON */
  .copy-btn {
    position: absolute;
    top: 0.4rem; right: 0.5rem;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text3);
    font-family: var(--mono); font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s, border-color 0.15s;
    letter-spacing: 0.03em;
  }
  pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover, .copy-btn.copied { color: var(--green); border-color: var(--green); opacity: 1; }

  /* TABLE OF CONTENTS */
  .toc {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 2.5rem;
    overflow: hidden;
  }
  .toc summary {
    font-size: 11px; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer; padding: 0.75rem 1.25rem;
    list-style: none; user-select: none;
    transition: color 0.15s;
  }
  .toc summary::-webkit-details-marker { display: none; }
  .toc summary::before { content: '▸  '; color: var(--green); }
  .toc[open] summary::before { content: '▾  '; }
  .toc summary:hover { color: var(--text2); }
  .toc ol { list-style: none; padding: 0 1.25rem 0.75rem; border-top: 1px solid var(--border); }
  .toc li { padding: 0.25rem 0; }
  .toc li a { font-size: 13px; color: var(--text2); text-decoration: none; transition: color 0.15s; }
  .toc li a:hover { color: var(--green); }
  .toc-sub { padding-left: 1.25rem; }
  .toc-sub a { font-size: 12px; color: var(--text3); }

  .post-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2.5rem 0;
  }

  .post-content img {
    max-width: 100%;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin: 1.5rem 0;
  }

  .post-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5rem 0;
    font-size: 13px;
  }
  .post-content th {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 0.6rem 1rem;
    text-align: left;
    color: var(--text);
    font-weight: 500;
  }
  .post-content td {
    border: 1px solid var(--border);
    padding: 0.6rem 1rem;
    color: var(--text2);
  }
  .post-content tr:nth-child(even) td { background: var(--bg2); }

  /* NAV FOOTER */
  .post-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 0;
    border-top: 1px solid var(--border);
    font-size: 13px;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .post-nav a {
    color: var(--text2);
    text-decoration: none;
    transition: color 0.2s;
  }
  .post-nav a:hover { color: var(--green); }

  @media (max-width: 600px) {
    .post-content pre { font-size: 12px; padding: 1rem; }
    .post-content table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .copy-btn { opacity: 1; } /* always visible on touch */
  }

  /* ERROR / LOADING */
  .state-msg {
    padding: 6rem 0;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
  }

</style>
</head>
<body>

<div id="reading-progress"></div>
<nav>
  <a href="../index.html" class="nav-logo"><span>~/</span>gg</a>
  <ul class="nav-links" id="nav-links">
    <li><a href="../index.html#skills" onclick="closeNav()">skills</a></li>
    <li><a href="../index.html#cv" onclick="closeNav()">cv</a></li>
    <li><a href="../index.html#projects" onclick="closeNav()">projects</a></li>
    <li><a href="../index.html#passions" onclick="closeNav()">passions</a></li>
    <li><a href="../index.html#contact" onclick="closeNav()">contact</a></li>
    <li><a href="index.html" class="active" onclick="closeNav()">blog</a></li>
  </ul>
  <div class="nav-right">
    <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
    <button class="nav-burger" id="nav-burger" aria-label="Toggle menu" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<main id="main">
  <div class="container">
    <noscript><div class="state-msg">JavaScript is required to view this post.</div></noscript>
    <div class="state-msg" id="status">Loading post...</div>
  </div>
</main>

<footer>
  <div class="container">
    <a href="index.html">← all posts</a>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  function parseFrontmatter(raw) {
    const m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) return { meta: {}, body: raw };
    const meta = {};
    m[1].split('\n').forEach(line => {
      const idx = line.indexOf(':');
      if (idx === -1) return;
      const key = line.slice(0, idx).trim();
      let val = line.slice(idx + 1).trim();
      if (val.startsWith('[') && val.endsWith(']'))
        val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
      else if (val.length >= 2 && val[0] === val[val.length - 1] && (val[0] === '"' || val[0] === "'"))
        val = val.slice(1, -1);
      meta[key] = val;
    });
    return { meta, body: m[2] };
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function readingTime(text) {
    const mins = Math.max(1, Math.ceil(text.trim().split(/\s+/).length / 200));
    return `${mins} min read`;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function buildToc(contentEl) {
    const headings = [...contentEl.querySelectorAll('h2, h3')];
    if (headings.length < 2) return;
    headings.forEach((h, i) => {
      if (!h.id) h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + (i ? `-${i}` : '');
    });
    const items = headings.map(h => {
      const sub = h.tagName === 'H3' ? ' class="toc-sub"' : '';
      return `<li${sub}><a href="#${h.id}">${escapeHtml(h.textContent)}</a></li>`;
    }).join('');
    const toc = document.createElement('details');
    toc.className = 'toc';
    toc.innerHTML = `<summary>Contents</summary><ol>${items}</ol>`;
    contentEl.insertAdjacentElement('beforebegin', toc);
  }

  function addCopyButtons(contentEl) {
    contentEl.querySelectorAll('pre').forEach(pre => {
      const code = pre.querySelector('code');

      // Language label (swap with copy button on hover)
      const langMatch = code?.className?.match(/language-(\w+)/);
      if (langMatch && langMatch[1] !== 'plaintext') {
        const label = document.createElement('span');
        label.className = 'lang-label';
        label.textContent = langMatch[1];
        pre.appendChild(label);
      }

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(code?.textContent || pre.textContent).then(() => {
          btn.textContent = 'copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 2000);
        });
      });
      pre.appendChild(btn);
    });
  }

  function initProgressBar() {
    const bar = document.getElementById('reading-progress');
    window.addEventListener('scroll', () => {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = total > 0 ? (window.scrollY / total * 100) + '%' : '0%';
    }, { passive: true });
  }

  marked.use({ gfm: true });

  async function loadPost() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const main = document.getElementById('main');

    if (!slug) { document.getElementById('status').textContent = 'No post specified.'; return; }

    try {
      const res = await fetch(`posts/${slug}.md`);
      if (!res.ok) throw new Error(`Post not found (${res.status})`);
      const raw = await res.text();
      const { meta, body } = parseFrontmatter(raw);

      if (meta.draft !== 'false') {
        main.innerHTML = `<div class="container"><div class="state-msg">Post not found.</div></div>`;
        return;
      }

      const title = meta.title || slug;
      const desc  = meta.description || '';
      const BASE_URL = 'https://gomesgoncalo.github.io';
      document.title = title + ' — Gonçalo Gomes';
      document.querySelector('meta[property="og:title"]').setAttribute('content', title + ' — Gonçalo Gomes');
      document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
      const postUrl = `${BASE_URL}/blog/post.html?slug=${encodeURIComponent(slug)}`;
      document.querySelector('meta[property="og:url"]').setAttribute('content', postUrl);
      document.querySelector('link[rel="canonical"]').setAttribute('href', postUrl);

      const tags = Array.isArray(meta.tags) ? meta.tags : [];
      const tagsHTML = tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

      main.innerHTML = `
        <div class="container">
          <header class="post-header">
            <div class="terminal-line">
              <span class="prompt-sym">❯</span>
              <span class="prompt-path">~/blog/posts</span>
              <span class="prompt-cmd">cat ${escapeHtml(slug)}.md</span>
            </div>
            <h1 class="post-title">${escapeHtml(title)}</h1>
            <div class="post-meta-bar">
              ${meta.date ? `<span class="post-date">${formatDate(meta.date)}</span>` : ''}
              <span class="read-time">${readingTime(body)}</span>
              ${tagsHTML ? `<div class="post-tags">${tagsHTML}</div>` : ''}
            </div>
          </header>
          <article class="post-content" id="post-content"></article>
          <div class="post-nav">
            <a href="index.html">← all posts</a>
            <a href="../index.html">portfolio</a>
          </div>
        </div>`;

      const contentEl = document.getElementById('post-content');
      contentEl.innerHTML = marked.parse(body);
      hljs.highlightAll();
      buildToc(contentEl);
      addCopyButtons(contentEl);
      initProgressBar();
    } catch (err) {
      main.innerHTML = `<div class="container"><div class="state-msg">Could not load post: ${escapeHtml(err.message)}</div></div>`;
      console.error(err);
    }
  }

  loadPost();
</script>
<script src="../shared.js"></script>
</body>
</html>
