<style>
  /* PAGE HEADER */
  .page-header {
    padding: 7rem 0 3rem;
  }

  .terminal-line {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 12px; color: var(--text3); margin-bottom: 1.5rem;
  }
  .prompt-sym { color: var(--green); }
  .prompt-path { color: var(--blue); }
  .prompt-cmd { color: var(--text2); }

  .page-title {
    font-family: var(--sans);
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 0.75rem;
  }
  .page-title .accent { color: var(--green); }

  .page-subtitle {
    color: var(--text2);
    font-size: 14px;
    max-width: 480px;
  }

  /* CONTROLS */
  .blog-controls {
    display: flex; align-items: center; gap: 1rem;
    padding: 2rem 0 1rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .blog-count {
    font-size: 12px;
    color: var(--text3);
    margin-left: auto;
    white-space: nowrap;
  }

  /* SEARCH */
  .search-wrap {
    display: flex; align-items: center;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 0 0.75rem;
    font-family: var(--mono);
    font-size: 12px;
    flex: 1; max-width: 420px;
    transition: border-color 0.2s;
  }
  .search-wrap:focus-within { border-color: var(--green); }
  .search-prefix, .search-suffix { color: var(--text3); white-space: nowrap; user-select: none; }
  .search-input {
    background: none; border: none; outline: none;
    color: var(--text);
    font-family: var(--mono); font-size: 12px;
    padding: 0.5rem 0.25rem;
    width: 100%; min-width: 60px;
    caret-color: var(--green);
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input::-webkit-search-cancel-button { display: none; }
  .search-hint {
    font-size: 11px; color: var(--text3);
    border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 5px;
    margin-left: 0.5rem;
    flex-shrink: 0;
  }

  mark {
    background: var(--green-glow);
    color: var(--green);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* POST LIST */
  .post-list { display: flex; flex-direction: column; gap: 0; }

  .post-entry {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 0 2rem;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    transition: background 0.15s;
    border-radius: 4px;
    position: relative;
  }
  .post-entry::before {
    content: '';
    position: absolute;
    left: -1rem; top: 0; bottom: 0; width: 2px;
    background: var(--green);
    transform: scaleY(0);
    transition: transform 0.2s;
    border-radius: 1px;
  }
  .post-entry:hover::before { transform: scaleY(1); }
  .post-entry:hover .post-title { color: var(--green); }

  .post-meta { display: flex; flex-direction: column; gap: 0.4rem; padding-top: 0.25rem; }
  .post-date { font-size: 11px; color: var(--text3); letter-spacing: 0.05em; }
  .post-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-clickable { cursor: pointer; transition: background 0.15s, color 0.15s; }
  .tag-clickable:hover { background: var(--green-dim); color: var(--green); }

  .post-body {}
  .post-title {
    font-family: var(--sans);
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.4rem;
    transition: color 0.2s;
  }
  .post-desc { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .read-time { font-size: 11px; color: var(--text3); }

  /* EMPTY STATE */
  .empty-state {
    padding: 4rem 0;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
  }

  /* LOADING */
  .loading {
    padding: 4rem 0;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
  }
  .loading::after {
    content: '';
    animation: dots 1.2s infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    33%  { content: '.'; }
    66%  { content: '..'; }
    100% { content: '...'; }
  }

  /* TAG FILTER ROW */
  .tag-filters {
    display: flex; gap: 0.5rem; flex-wrap: wrap;
    padding-bottom: 1.5rem;
  }
  .tag-filters:empty { display: none; }
  .tag-filter {
    background: none;
    border: 1px solid var(--border);
    color: var(--text3);
    font-family: var(--mono); font-size: 10px;
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .tag-filter:hover { border-color: var(--green2); color: var(--green2); }
  .tag-filter.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .tag-count { opacity: 0.6; font-size: 9px; }

  .rss-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    margin-top: 1rem;
    font-size: 11px;
    color: var(--text3);
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 0.2s;
  }
  .rss-link:hover { color: var(--amber); }

  @media (max-width: 600px) {
    .search-wrap { max-width: 100%; }
    .blog-count { margin-left: 0; }
    .post-entry { grid-template-columns: 1fr; gap: 0.5rem; }
    .post-meta { flex-direction: row; align-items: center; flex-wrap: wrap; }
  }
</style>
</head>

<main>
  <div class="container">
    <header class="page-header">
      <div class="terminal-line">
        <span class="prompt-sym">❯</span>
        <span class="prompt-path">~/blog</span>
        <span class="prompt-cmd">ls -lt posts/</span>
      </div>
      <h1 class="page-title">The <span class="accent">Blog</span></h1>

      <a href="/rss.xml" class="rss-link" title="Subscribe via RSS">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3a1 1 0 0 0 0 2 16 16 0 0 1 16 16 1 1 0 0 0 2 0A18 18 0 0 0 3 3zm0 6a1 1 0 0 0 0 2 10 10 0 0 1 10 10 1 1 0 0 0 2 0A12 12 0 0 0 3 9zm0 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        RSS feed
      </a>

    <div class="blog-controls">
      <div class="search-wrap">
        <span class="search-prefix">grep&nbsp;"</span>
        <input type="search" id="search-input" class="search-input"
               placeholder="search posts..." autocomplete="off" spellcheck="false">
        <span class="search-suffix">"</span>
        <span class="search-hint" id="search-hint" title="Press / to focus">/</span>
      </div>
      <span class="blog-count" id="post-count"></span>
    </div>

    <div id="tag-filters" class="tag-filters"></div>

    <div class="post-list" id="post-list">

  </div>
</footer>

<script>
  let allPosts = [];
  let activeTags = new Set();
  let currentQuery = '';
  let bodiesLoaded = false;
  let bodiesLoadingPromise = null;

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function readingTime(text) {
    const mins = Math.max(1, Math.ceil(text.trim().split(/\s+/).length / 200));
    return `${mins} min read`;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Highlight all keywords (space-separated) in text
  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const keywords = query.trim().split(/\s+/).filter(Boolean)
      .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!keywords.length) return escapeHtml(text);
    return escapeHtml(text).replace(new RegExp(keywords.join('|'), 'gi'), m => `<mark>${m}</mark>`);
  }

  function bodySnippet(content, query) {
    if (!content) return '';
    const keywords = query.trim().split(/\s+/).filter(Boolean);
    for (const kw of keywords) {
      const idx = content.toLowerCase().indexOf(kw.toLowerCase());
      if (idx !== -1) {
        const start = Math.max(0, idx - 80);
        const end   = Math.min(content.length, idx + kw.length + 80);
        const raw   = (start > 0 ? '…' : '') + content.slice(start, end) + (end < content.length ? '…' : '');
        return highlight(raw, query);
      }
    }
    return '';
  }

  function getFiltered() {
    const keywords = currentQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return allPosts.filter(p => {
      if (activeTags.size > 0 && ![...activeTags].every(t => (p.tags || []).includes(t))) return false;
      if (!keywords.length) return true;
      return keywords.every(kw =>
        p.title.toLowerCase().includes(kw) ||
        (p.description || '').toLowerCase().includes(kw) ||
        (p.tags || []).some(t => t.toLowerCase().includes(kw)) ||
        (p.content !== null && p.content.toLowerCase().includes(kw))
      );
    });
  }

  function ensureBodiesLoaded() {
    if (bodiesLoaded) return Promise.resolve();
    if (bodiesLoadingPromise) return bodiesLoadingPromise;
    bodiesLoadingPromise = Promise.all(allPosts.map(async p => {
      if (p.content !== null) return;
      try {
        const r = await fetch(`posts/${p.slug}.md`);
        if (!r.ok) { p.content = ''; return; }
        const raw = await r.text();
        const { body } = parseFrontmatter(raw);
        p.content = body
          .replace(/```[\s\S]*?```/g, ' ')
          .replace(/`[^`]+`/g, ' ')
          .replace(/[#*_[\]()>]/g, ' ')
          .replace(/\s+/g, ' ').trim();
      } catch { p.content = ''; }
    })).then(() => { bodiesLoaded = true; bodiesLoadingPromise = null; });
    return bodiesLoadingPromise;
  }

  function renderTagFilters(filtered) {
    const container = document.getElementById('tag-filters');
    // Total counts across all posts (to know which tags exist)
    const totalCounts = {};
    allPosts.forEach(p => (p.tags || []).forEach(t => { totalCounts[t] = (totalCounts[t] || 0) + 1; }));
    // Visible counts from the currently filtered posts
    const visibleCounts = {};
    filtered.forEach(p => (p.tags || []).forEach(t => { visibleCounts[t] = (visibleCounts[t] || 0) + 1; }));
    const allTags = Object.keys(totalCounts).sort();
    container.innerHTML = allTags.map(t =>
      `<button class="tag-filter${activeTags.has(t) ? ' active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)} <span class="tag-count">(${visibleCounts[t] || 0})</span></button>`
    ).join('');
  }

  function filterByTag(tag) {
    if (activeTags.has(tag)) activeTags.delete(tag);
    else activeTags.add(tag);
    const filtered = getFiltered();
    renderTagFilters(filtered);
    renderPosts(filtered);
  }

  function renderPosts(posts) {
    const list    = document.getElementById('post-list');
    const countEl = document.getElementById('post-count');
    const isFiltering = currentQuery.trim() || activeTags.size > 0;

    countEl.textContent = isFiltering
      ? `${posts.length} of ${allPosts.length} result${posts.length !== 1 ? 's' : ''}`
      : `${allPosts.length} post${allPosts.length !== 1 ? 's' : ''}`;

    if (posts.length === 0) {
      list.innerHTML = isFiltering
        ? `<div class="empty-state">No posts matching your filters.</div>`
        : `<div class="empty-state">No posts yet. Check back soon.</div>`;
      return;
    }

    const q = currentQuery.trim();
    list.innerHTML = posts.map(p => {
      const inMeta = !q
        || p.title.toLowerCase().split(/\s+/).some(w => q.toLowerCase().split(/\s+/).some(k => w.includes(k)))
        || (p.description || '').toLowerCase().split(/\s+/).some(w => q.toLowerCase().split(/\s+/).some(k => w.includes(k)));
      const descHTML = inMeta
        ? highlight(p.description || '', q)
        : bodySnippet(p.content, q) || highlight(p.description || '', q);

      return `
        <a class="post-entry" href="posts/${encodeURIComponent(p.slug)}.html">
          <div class="post-meta">
            <span class="post-date">${formatDate(p.date)}</span>
            <span class="read-time">${p.readTime}</span>
            <div class="post-tags">
              ${(p.tags || []).map(t =>
                `<span class="tag tag-clickable" data-tag="${escapeHtml(t)}">${highlight(t, q)}</span>`
              ).join('')}
            </div>
          </div>
          <div class="post-body">
            <div class="post-title">${highlight(p.title, q)}</div>
            <div class="post-desc">${descHTML}</div>
          </div>
        </a>`;
    }).join('');
  }

  function parseFrontmatter(raw) {
    const m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) return { meta: {}, body: raw };
    const meta = {};
    m[1].split('\n').forEach(line => {
      const idx = line.indexOf(':');
      if (idx === -1) return;
      const key = line.slice(0, idx).trim();
      let val = line.slice(idx + 1).trim();
      if (val.startsWith('[') && val.endsWith(']'))
        val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^['"]|['"]$/g, '')).filter(Boolean);
      else if (val.length >= 2 && val[0] === val[val.length - 1] && (val[0] === '"' || val[0] === "'"))
        val = val.slice(1, -1);
      meta[key] = val;
    });
    return { meta, body: m[2] };
  }

  async function loadPosts() {
    const list = document.getElementById('post-list');
    try {
      const res = await fetch('posts.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('Failed to load posts.json');
      const posts = await res.json();

      if (posts.length === 0) { allPosts = []; renderPosts([]); return; }

      allPosts = posts.map(p => ({
        slug:        p.slug,
        title:       p.title        || p.slug,
        date:        p.date         || '',
        description: p.description  || '',
        tags:        Array.isArray(p.tags) ? p.tags : [],
        readTime:    p.read_time    || '',
        content:     null,
      }));

      const filtered = getFiltered();
      renderTagFilters(filtered);
      renderPosts(filtered);
    } catch (err) {
      list.innerHTML = '<div class="empty-state">Could not load posts.</div>';
      console.error(err);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('search-input');
    const hint  = document.getElementById('search-hint');

    input.addEventListener('input', async e => {
      currentQuery = e.target.value;
      let filtered = getFiltered();
      renderTagFilters(filtered);
      renderPosts(filtered);
      if (currentQuery.trim()) {
        await ensureBodiesLoaded();
        filtered = getFiltered();
        renderTagFilters(filtered);
        renderPosts(filtered);
      }
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        input.value = ''; currentQuery = '';
        const filtered = getFiltered();
        renderTagFilters(filtered);
        renderPosts(filtered);
        input.blur();
      }
    });
    input.addEventListener('focus', () => hint.style.display = 'none');
    input.addEventListener('blur',  () => { if (!input.value) hint.style.display = ''; });

    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
    });

    // Tag clicks in post list (delegated)
    document.getElementById('post-list').addEventListener('click', e => {
      const tagEl = e.target.closest('[data-tag]');
      if (tagEl && tagEl.classList.contains('tag-clickable')) {
        e.preventDefault();
        filterByTag(tagEl.dataset.tag);
      }
    });

    // Tag filter buttons (delegated)
    document.getElementById('tag-filters').addEventListener('click', e => {
      const btn = e.target.closest('.tag-filter');
      if (btn) filterByTag(btn.dataset.tag);
    });
  });

  loadPosts();
</script>
<script src="../shared.js"></script>
</body>
